name: Deploy to Github Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:

# Allow one concurrent deployment
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - uses: pnpm/setup@v3.1.2
        with:
          runtime: node@26.13.1

      - name: Type checking
        run: pnpm check

      - name: Check code style
        run: |
          pnpm fmt
          git --no-pager diff --exit-code

      - name: CI tests
        run: pnpm test

      - name: Build
        run: pnpm vite build

      - run: node scripts/postbuild.js

      - name: Upload build
        uses: actions/upload-artifact@v7.0.2
        if: ${{ github.ref == 'refs/heads/main' }}
        with:
          name: build
          path: build

  upload:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - name: Download build
        uses: actions/download-artifact@v8.0.2
        with:
          name: build
      - name: Sync
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s %s\n' "$SSH_HOST" "$SSH_HOST_KEY" > ~/.ssh/known_hosts

          eval "$(ssh-agent -s)" >/dev/null
          trap 'ssh-agent -k >/dev/null 2>&1 || true' EXIT INT TERM
          printf '%s\n' "$SSH_KEY" | ssh-add -t 300 -

          rsync --verbose --human-readable --archive \
            --checksum --delete \
            --rsh "ssh -o StrictHostKeyChecking=yes" \
            . "$SSH_USERNAME@$SSH_HOST:/"
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_HOST_KEY: ${{ secrets.SSH_HOST_KEY }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
